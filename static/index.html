<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Image-to-Image Library</title>
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="topbar">
    <div class="topbar-left">
      <span class="brand">🖼️ Image Library</span>
      <select id="projectSwitcher"></select>
      <button id="newProjectBtn" class="btn-ghost">+ New Project</button>
      <button id="deleteProjectBtn" class="btn-ghost small" title="Move this project to trash">🗑 Delete Project</button>
    </div>
    <div class="topbar-right">
      <button id="duplicatesBtn" class="btn-ghost">Find Duplicates</button>
      <button id="logsBtn" class="btn-ghost">📜 Logs</button>
      <button id="trashBtn" class="btn-ghost">🗑 Trash</button>
      <button id="exportBtn" class="btn-ghost">Export</button>
      <button id="maximizeViewportBtn" class="btn-ghost" title="Maximize viewport — hide side panels (hotkey: f)">⛶ Maximize</button>
      <button id="settingsBtn" class="btn-ghost">Settings</button>
    </div>
  </div>

  <div id="layout">
    <aside id="sidebar">
      <div class="panel-section">
        <div class="sidebar-tabs">
          <button class="sidebar-tab-btn active" id="imagesTabBtn" data-sidebar-tab="images">Images</button>
          <button class="sidebar-tab-btn" id="referencesTabBtn" data-sidebar-tab="references">References</button>
        </div>
        <div id="imagesTabPanel">
          <div class="sidebar-controls">
            <input id="searchInput" type="text" placeholder="Search images..." />
            <div class="sidebar-controls-row">
              <select id="sortSelect">
                <option value="recent_result">Latest Result</option>
                <option value="date">Newest</option>
                <option value="name">Name</option>
                <option value="evaluation">Evaluation</option>
              </select>
              <select id="filterSelect">
                <option value="all">All</option>
                <option value="unprocessed">Unprocessed</option>
                <option value="UNRATED">Needs Review</option>
                <option value="YES">Approved</option>
                <option value="MAYBE">Maybe</option>
                <option value="NO">Rejected</option>
              </select>
              <button id="cleanupNoBtn" class="btn-ghost small" title="Move all NO-rated results in this project to trash">🗑 Clear NO</button>
              <button id="refreshImagesBtn" class="btn-ghost small" title="Force a full refresh of the image list, in case an update was missed">⟳</button>
            </div>
          </div>
          <label class="upload-drop" id="uploadDrop">
            + Upload images (or paste)
            <input id="uploadInput" type="file" accept="image/*" multiple hidden />
          </label>
          <label class="checkbox-row" title="After upload, immediately queue a generation using the prompt currently in the details panel">
            <input id="autoGenOnUploadToggle" type="checkbox" />
            Auto-generate with current prompt
          </label>
          <div id="uploadStatus" class="status-line"></div>
          <div class="sidebar-controls-row">
            <button id="multiSelectToggleBtn" class="btn-ghost small">☑ Select</button>
            <button id="lineageToggleBtn" class="btn-ghost small" title="Group images under the image they were derived from (via &quot;use as new source&quot; on a result)">⑂ Lineage</button>
            <span id="multiSelectBar" class="multi-select-bar" style="display:none">
              <span id="multiSelectCount"></span>
              <button id="multiSelectMoveBtn" class="btn-ghost small">Move</button>
            </span>
          </div>
          <div id="imageList" class="image-list"></div>
        </div>
        <div id="referencesTabPanel" style="display:none">
          <p class="dup-section-hint reference-tab-hint">Reference images are a separate per-project library used as extra generation inputs (ComfyUI, Grok, and most fal.ai models) -- they don't show up in the main image list.</p>
          <label class="upload-drop" id="referenceUploadDrop">
            + Add reference image (or paste)
            <input id="referenceUploadInput" type="file" accept="image/*" multiple hidden />
          </label>
          <div id="referenceUploadStatus" class="status-line"></div>
          <div id="referenceLibraryGrid" class="reference-library-grid"></div>
        </div>
      </div>
      <div class="panel-edge panel-edge-sidebar">
        <div class="panel-resize-handle" id="sidebarResizeHandle"></div>
        <button class="panel-collapse-btn" id="sidebarCollapseBtn" title="Collapse sidebar">‹</button>
      </div>
    </aside>
    <button class="panel-expand-tab panel-expand-tab-sidebar" id="sidebarExpandTab" title="Expand sidebar" style="display:none">›</button>

    <main id="viewer"></main>

    <button class="panel-expand-tab panel-expand-tab-details" id="detailsExpandTab" title="Expand details panel" style="display:none">‹</button>
    <aside id="detailsPanel">
      <div class="panel-edge panel-edge-details">
        <button class="panel-collapse-btn" id="detailsCollapseBtn" title="Collapse details panel">›</button>
        <div class="panel-resize-handle" id="detailsResizeHandle"></div>
      </div>
      <div class="panel-section" id="promptPaletteSection">
        <div class="panel-header">
          <span>Prompt Palette <span id="promptCount" class="prompt-count"></span></span>
          <span class="panel-header-actions">
            <button id="newPromptBtn" class="btn-ghost small">+ New</button>
            <button id="promptPaletteToggleBtn" class="btn-ghost small" title="Collapse/expand prompt palette">▾</button>
          </span>
        </div>
        <input id="promptFilterInput" type="text" class="prompt-filter" placeholder="Filter prompts..." />
        <div id="promptList" class="prompt-list"></div>
      </div>

      <div id="detailsEmpty" class="empty-state">Select an image to see details.</div>
      <div id="detailsContent" style="display:none">
        <div class="field">
          <label>Name</label>
          <input id="displayNameInput" type="text" />
        </div>
        <div id="provenanceLine" class="provenance-line" style="display:none"></div>
        <div class="field">
          <label>Comment</label>
          <textarea id="commentInput" rows="2"></textarea>
        </div>

        <div class="field">
          <label>Prompt</label>
          <select id="promptSelect">
            <option value="">— ad-hoc —</option>
          </select>
          <textarea id="promptTextarea" rows="15" placeholder="Describe the edit..."></textarea>
        </div>
        <div class="field-row">
          <select id="engineSelect">
            <option value="grok">Grok</option>
            <option value="comfyui">ComfyUI (local)</option>
            <option value="fal">fal.ai</option>
          </select>
          <select id="aspectRatioSelect" title="Output aspect ratio (Grok only -- for other engines, use the crop button above the image to frame the source)">
            <option value="">Keep original</option>
            <option value="1:1">1:1</option>
            <option value="16:9">16:9</option>
            <option value="3:2">3:2</option>
            <option value="4:3">4:3</option>
            <option value="9:16">9:16</option>
            <option value="2:3">2:3</option>
            <option value="3:4">3:4</option>
          </select>
        </div>
        <div class="preprocess-note" id="preprocessNote" style="display:none">
          <span id="preprocessNoteText"></span>
          <button type="button" class="btn-ghost small" id="preprocessClearBtn" title="Send the original, unmodified source instead">Remove</button>
        </div>
        <div class="field" id="referenceImagesField" style="display:none">
          <label>Reference images <span class="hint">(up to 2; not all fal.ai models support these)</span></label>
          <div id="referenceImageList" class="reference-image-list"></div>
          <button id="addReferenceImageBtn" class="btn-ghost small" type="button">+ Add reference image</button>
        </div>
        <div class="field-row">
          <button id="generateBtn" class="btn-primary">✨ Generate</button>
        </div>
        <input id="uploadResultInput" type="file" accept="image/*" hidden />
        <div id="generateStatus" class="status-line"></div>

        <div class="field">
          <label>Results (<span id="resultCount">0</span>)</label>
          <div id="resultGrid" class="result-grid"></div>
        </div>
        <div id="revisedPrompt" class="revised-prompt"></div>

        <div class="field" style="margin-top: 24px; border-top: 1px solid #2a2c35; padding-top: 16px;">
          <button id="deleteImageBtn" class="btn-danger" style="width:100%">🗑 Delete Image (and all its results)</button>
        </div>
      </div>
    </aside>
  </div>

  <div id="modalOverlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modalContent"></div>
  </div>

  <div id="queueOverlay" class="queue-overlay" style="display:none">
    <div id="queueOverlayBar" class="queue-overlay-bar"></div>
    <div id="queueOverlayHeader" class="queue-overlay-header">
      <span class="queue-overlay-label">Queue</span>
      <span id="queueOverlayCount" class="queue-overlay-count">0</span>
      <span id="queueOverlayElapsed" class="queue-overlay-elapsed"></span>
    </div>
    <div id="queueOverlayList" class="queue-overlay-list" style="display:none"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
