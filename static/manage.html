<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Review &amp; Export</title>
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="/css/manage.css" />
</head>
<body class="manage-page">
  <div id="topbar">
    <nav class="topbar-left topbar-tabs" aria-label="Sections">
      <a href="/" class="topbar-tab"><span class="topbar-tab-label">🖼️ Image Library</span></a>
      <div class="topbar-tab active" aria-current="page"><span class="topbar-tab-label">🗂 Review &amp; Export</span></div>
    </nav>
    <div class="topbar-right">
      <span id="indexStatus" class="manage-index-status"></span>
      <div class="topbar-menu" id="topbarMenu">
        <button id="topbarMenuBtn" class="btn-ghost topbar-menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu" title="Menu">☰</button>
        <div id="topbarMenuPanel" class="topbar-menu-panel" style="display:none">
          <button id="duplicatesBtn" class="topbar-menu-item" type="button" title="Open the Duplicates tab for the selected libraries"><span class="topbar-menu-icon" aria-hidden="true">🔍</span><span class="topbar-menu-label">Find Duplicates</span></button>
          <button id="logsBtn" class="topbar-menu-item" type="button"><span class="topbar-menu-icon" aria-hidden="true">📜</span><span class="topbar-menu-label">Logs</span></button>
          <button id="trashBtn" class="topbar-menu-item" type="button"><span class="topbar-menu-icon" aria-hidden="true">🗑</span><span class="topbar-menu-label">Trash</span></button>
          <button id="exportBtn" class="topbar-menu-item" type="button" title="Open the Review tab, where the current view can be exported"><span class="topbar-menu-icon" aria-hidden="true">📤</span><span class="topbar-menu-label">Export…</span></button>
          <button id="settingsBtn" class="topbar-menu-item" type="button"><span class="topbar-menu-icon" aria-hidden="true">⚙</span><span class="topbar-menu-label">Settings</span></button>
          <div class="topbar-menu-divider"></div>
          <button id="hotkeysBtn" class="topbar-menu-item" type="button"><span class="topbar-menu-icon" aria-hidden="true">⌨</span><span class="topbar-menu-label">Hotkeys</span><kbd>?</kbd></button>
        </div>
      </div>
    </div>
  </div>

  <div id="manageLayout">
    <aside id="manageSidebar">
      <div class="panel-header">
        <span>Libraries</span>
        <span class="manage-select-actions">
          <button id="selectAllBtn" class="btn-ghost small" type="button">All</button>
          <button id="selectNoneBtn" class="btn-ghost small" type="button">None</button>
        </span>
      </div>
      <p id="selectionHint" class="manage-hint"></p>
      <div id="projectList" class="manage-project-list"></div>
      <label class="manage-archived-toggle">
        <input id="showArchivedInput" type="checkbox" /> Show archived
      </label>
    </aside>

    <main id="manageMain">
      <div class="sidebar-tabs manage-tabs" role="tablist">
        <button class="sidebar-tab-btn" data-manage-tab="prompts" role="tab">Prompts</button>
        <button class="sidebar-tab-btn" data-manage-tab="duplicates" role="tab">Duplicates</button>
        <button class="sidebar-tab-btn" data-manage-tab="review" role="tab">Review</button>
        <button class="sidebar-tab-btn" data-manage-tab="reports" role="tab">Reports</button>
      </div>
      <div id="tabPanel" class="manage-tab-panel"></div>
    </main>
  </div>

  <div id="modalOverlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modalContent"></div>
  </div>

  <script type="module" src="/js/manage.js"></script>
</body>
</html>
