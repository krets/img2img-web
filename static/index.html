<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Image-to-Image Library</title>
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="topbar">
    <nav class="topbar-left topbar-tabs" aria-label="Sections">
      <div class="topbar-tab active" aria-current="page">
        <span class="topbar-tab-label">🖼️ Image Library</span>
        <div class="project-menu" id="projectMenu">
        <button id="projectMenuBtn" class="project-menu-btn" type="button" aria-haspopup="true" aria-expanded="false" title="Switch, rename or delete projects">
          <span id="projectMenuName" class="project-menu-name">Projects</span>
          <span class="project-menu-caret">▾</span>
        </button>
        <div id="projectPanel" class="project-panel" style="display:none"></div>
        </div>
      </div>
      <a href="/manage" class="topbar-tab"><span class="topbar-tab-label">🗂 Review &amp; Export</span></a>
    </nav>
    <div class="topbar-right">
      <button id="comfyStatsBtn" class="btn-ghost comfy-stats-btn" type="button" style="display:none" title="ComfyUI VRAM — click to free models and cache">
        <span class="comfy-stats-icon" aria-hidden="true">🖥</span>
        <span class="comfy-stats-bar"><span id="comfyStatsBarFill" class="comfy-stats-bar-fill"></span></span>
        <span id="comfyStatsLabel" class="comfy-stats-label"></span>
      </button>
      <div class="topbar-menu" id="topbarMenu">
        <button id="topbarMenuBtn" class="btn-ghost topbar-menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu" title="Menu">☰</button>
        <div id="topbarMenuPanel" class="topbar-menu-panel" style="display:none">
          <button id="duplicatesBtn" class="topbar-menu-item" type="button"><span class="topbar-menu-icon" aria-hidden="true">🔍</span><span class="topbar-menu-label">Find Duplicates</span></button>
          <button id="logsBtn" class="topbar-menu-item" type="button"><span class="topbar-menu-icon" aria-hidden="true">📜</span><span class="topbar-menu-label">Logs</span></button>
          <button id="trashBtn" class="topbar-menu-item" type="button"><span class="topbar-menu-icon" aria-hidden="true">🗑</span><span class="topbar-menu-label">Trash</span></button>
          <a id="exportLink" href="/manage" class="topbar-menu-item" title="Open Review &amp; Export, starting with this project"><span class="topbar-menu-icon" aria-hidden="true">📤</span><span class="topbar-menu-label">Export…</span></a>
          <button id="maximizeViewportBtn" class="topbar-menu-item" type="button" title="Maximize viewport — hide side panels"><span class="topbar-menu-icon" aria-hidden="true">⛶</span><span class="topbar-menu-label">Maximize</span><kbd>F</kbd></button>
          <button id="settingsBtn" class="topbar-menu-item" type="button"><span class="topbar-menu-icon" aria-hidden="true">⚙</span><span class="topbar-menu-label">Settings</span></button>
          <div class="topbar-menu-divider"></div>
          <button id="hotkeysBtn" class="topbar-menu-item" type="button"><span class="topbar-menu-icon" aria-hidden="true">⌨</span><span class="topbar-menu-label">Hotkeys</span><kbd>?</kbd></button>
        </div>
      </div>
    </div>
  </div>

  <div id="layout">
    <aside id="sidebar">
      <div class="panel-section">
        <div class="sidebar-tabs">
          <button class="sidebar-tab-btn active" id="imagesTabBtn" data-sidebar-tab="images">Images</button>
          <button class="sidebar-tab-btn" id="referencesTabBtn" data-sidebar-tab="references">References</button>
          <button id="libraryMenuBtn" class="sidebar-menu-btn" type="button" aria-haspopup="true" aria-label="Source library actions" title="Source library actions">⋮</button>
        </div>
        <div id="imagesTabPanel">
          <div class="sidebar-controls">
            <input id="searchInput" type="text" placeholder="Search images..." />
            <div class="sidebar-controls-row">
              <select id="sortSelect">
                <option value="recent_result">Latest Result</option>
                <option value="date">Newest</option>
                <option value="name">Name</option>
                <option value="evaluation">Evaluation</option>
              </select>
              <select id="filterSelect">
                <option value="all">All</option>
                <option value="unprocessed">Unprocessed</option>
                <option value="UNRATED">Needs Review</option>
                <option value="YES">Approved</option>
                <option value="MAYBE">Maybe</option>
                <option value="NO">Rejected</option>
              </select>
            </div>
          </div>
          <div class="upload-drop-row">
            <label class="upload-drop" id="uploadDrop">
              + Upload images (or paste)
              <input id="uploadInput" type="file" accept="image/*" multiple hidden />
            </label>
            <button id="uploadClickPasteToggle" type="button" class="icon-toggle-btn" aria-pressed="false">📋</button>
          </div>
          <div id="uploadStatus" class="status-line"></div>
          <div id="multiSelectBar" class="sidebar-controls-row multi-select-bar" style="display:none">
            <span id="multiSelectCount"></span>
            <button id="multiSelectMoveBtn" class="btn-ghost small">Move</button>
            <button id="multiSelectDoneBtn" class="btn-ghost small">Done</button>
          </div>
          <div id="imageList" class="image-list"></div>
        </div>
        <div id="referencesTabPanel" style="display:none">
          <p class="dup-section-hint reference-tab-hint">Reference images are a separate per-project library used as extra generation inputs (ComfyUI, Grok, and most fal.ai models) -- they don't show up in the main image list.</p>
          <div class="upload-drop-row">
            <label class="upload-drop" id="referenceUploadDrop">
              + Add reference image (or paste)
              <input id="referenceUploadInput" type="file" accept="image/*" multiple hidden />
            </label>
            <button id="referenceUploadClickPasteToggle" type="button" class="icon-toggle-btn" aria-pressed="false">📋</button>
          </div>
          <div id="referenceUploadStatus" class="status-line"></div>
          <div id="referenceLibraryGrid" class="reference-library-grid"></div>
        </div>
      </div>
      <div class="panel-edge panel-edge-sidebar">
        <div class="panel-resize-handle" id="sidebarResizeHandle"></div>
        <button class="panel-collapse-btn" id="sidebarCollapseBtn" title="Collapse sidebar">‹</button>
      </div>
    </aside>
    <button class="panel-expand-tab panel-expand-tab-sidebar" id="sidebarExpandTab" title="Expand sidebar" style="display:none">›</button>

    <main id="viewer"></main>

    <button class="panel-expand-tab panel-expand-tab-details" id="detailsExpandTab" title="Expand details panel" style="display:none">‹</button>
    <aside id="detailsPanel">
      <div class="panel-edge panel-edge-details">
        <button class="panel-collapse-btn" id="detailsCollapseBtn" title="Collapse details panel">›</button>
        <div class="panel-resize-handle" id="detailsResizeHandle"></div>
      </div>
      <div id="detailsContent">
        <div id="detailsEmpty" class="empty-state image-only-section" style="display:none">Select an image to see its name, comment, and results.</div>
        <div class="field image-only-section" style="display:none">
          <label>Name</label>
          <input id="displayNameInput" type="text" />
        </div>
        <div id="provenanceLine" class="provenance-line image-only-section" style="display:none"></div>
        <div class="field image-only-section" style="display:none">
          <label>Comment</label>
          <textarea id="commentInput" rows="2"></textarea>
        </div>

        <div class="field">
          <label>Prompt</label>
          <div class="prompt-menu" id="promptMenu">
            <button id="promptMenuBtn" class="prompt-menu-btn" type="button" aria-haspopup="true" aria-expanded="false" title="Pick, edit or delete saved prompts">
              <span id="promptMenuName" class="prompt-menu-name adhoc">— ad-hoc —</span>
              <span class="prompt-menu-caret">▾</span>
            </button>
            <div id="promptPanel" class="project-panel prompt-panel" style="display:none"></div>
          </div>
          <textarea id="promptTextarea" rows="15" placeholder="Describe the edit..."></textarea>
        </div>
        <div class="field-row">
          <select id="engineSelect">
            <option value="grok">Grok</option>
            <option value="comfyui">ComfyUI (local)</option>
            <option value="fal">fal.ai</option>
          </select>
          <select id="aspectRatioSelect" title="Output aspect ratio (Grok only -- for other engines, use the crop button above the image to frame the source)">
            <option value="">Keep original</option>
            <option value="1:1">1:1</option>
            <option value="16:9">16:9</option>
            <option value="3:2">3:2</option>
            <option value="4:3">4:3</option>
            <option value="9:16">9:16</option>
            <option value="2:3">2:3</option>
            <option value="3:4">3:4</option>
          </select>
        </div>
        <div class="field-row" id="comfyWorkflowRow" style="display:none">
          <select id="comfyWorkflowSelect" title="ComfyUI workflow to run">
            <option value="default">Default (Flux.2 edit)</option>
            <option value="sam3">SAM3 object scaling (advanced)</option>
            <option value="sam3_xy">SAM3 object scaling — X/Y (advanced)</option>
          </select>
        </div>
        <div class="field" id="sam3Fields" style="display:none">
          <label>SAM3 Prompt <span class="hint">(object to detect, e.g. "elephants")</span></label>
          <input id="sam3PromptInput" type="text" placeholder="Object to detect..." list="sam3PromptHistoryList" />
          <datalist id="sam3PromptHistoryList"></datalist>
          <div class="field-row" style="margin-top:6px">
            <div class="field" id="sam3ScaleByField" style="margin-bottom:0">
              <label>Scale by</label>
              <input id="sam3ScaleByInput" type="number" step="0.05" min="0.1" max="5" value="1.3" />
            </div>
            <div class="field" id="sam3ScaleXField" style="margin-bottom:0">
              <label>Scale X</label>
              <input id="sam3ScaleXInput" type="number" step="0.05" min="0.1" max="5" value="1.3" />
            </div>
            <div class="field" id="sam3ScaleYField" style="margin-bottom:0">
              <label>Scale Y</label>
              <input id="sam3ScaleYInput" type="number" step="0.05" min="0.1" max="5" value="1.3" />
            </div>
            <div class="field" style="margin-bottom:0">
              <label>LR Pin</label>
              <input id="sam3LrPinInput" type="number" step="0.05" min="0" max="1" value="0.5" />
            </div>
            <div class="field" style="margin-bottom:0">
              <label>TB Pin</label>
              <input id="sam3TbPinInput" type="number" step="0.05" min="0" max="1" value="0.5" />
            </div>
          </div>
        </div>
        <div class="preprocess-note" id="preprocessNote" style="display:none">
          <span id="preprocessNoteText"></span>
          <button type="button" class="btn-ghost small" id="preprocessClearBtn" title="Send the original, unmodified source instead">Remove</button>
        </div>
        <div class="field" id="referenceImagesField" style="display:none">
          <label>Reference images <span class="hint" id="referenceImagesHint">(up to 2; not all fal.ai models support these)</span></label>
          <div id="referenceImageList" class="reference-image-list"></div>
          <div class="field-row" style="margin-bottom:0">
            <button id="addReferenceImageBtn" class="btn-ghost small" type="button">+ Add reference image</button>
            <button id="sam3PlaceBtn" class="btn-ghost small" type="button" title="Detect an object with SAM3 in the background, then position it onto this image">✨ Detect object (SAM3)</button>
          </div>
        </div>
        <div class="field-row">
          <button id="generateBtn" class="btn-primary">✨ Generate</button>
          <button id="autoGenOnUploadToggle" type="button" class="icon-toggle-btn" aria-pressed="false">⚡</button>
        </div>
        <input id="uploadResultInput" type="file" accept="image/*" hidden />
        <div id="generateStatus" class="status-line"></div>

        <div class="field image-only-section" style="display:none">
          <label>Results (<span id="resultCount">0</span>)</label>
          <div id="resultGrid" class="result-grid"></div>
        </div>
        <div id="revisedPrompt" class="revised-prompt image-only-section" style="display:none"></div>

        <div class="field image-only-section" style="display:none; margin-top: 24px; border-top: 1px solid #2a2c35; padding-top: 16px;">
          <button id="deleteImageBtn" class="btn-danger" style="width:100%">🗑 Delete Image (and all its results)</button>
        </div>
      </div>
    </aside>
  </div>

  <div id="modalOverlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modalContent"></div>
  </div>

  <div id="queueOverlay" class="queue-overlay" style="display:none">
    <div id="queueOverlayBar" class="queue-overlay-bar"></div>
    <div id="queueOverlayHeader" class="queue-overlay-header">
      <span class="queue-overlay-label">Queue</span>
      <span id="queueOverlayCount" class="queue-overlay-count">0</span>
      <span id="queueOverlayElapsed" class="queue-overlay-elapsed"></span>
    </div>
    <div id="queueOverlayList" class="queue-overlay-list" style="display:none"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
